name: CI

# Why this exists: every infrastructure bug found on 2026-08-10 had been broken
# for weeks or months, because the only thing that ever verified this project
# was a human running a script by hand on one machine.  The asmjit submodule
# pin was reverted for two months; SDL2.xcframework was unusable for two
# months.  Both would have been caught on the first push by a job that clones
# the repo fresh and builds it.
#
# Deliberately Linux-only: it is fast and free, and it exercises the parts that
# actually broke (submodule wiring, CMake, repo hygiene).  The Apple-specific
# packaging scripts cannot run here; they self-validate instead (see
# validate_xcframework in scripts/build-*.sh).

on:
  push:
    branches: [main, jit]
  pull_request:
  workflow_dispatch:

jobs:
  fresh-clone-build:
    name: Fresh clone builds
    runs-on: ubuntu-latest
    steps:
      # submodules: recursive is the point of this job -- it proves the pins
      # resolve for someone who is not us.  A dangling pin fails HERE.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodules actually populated
        run: |
          test -f third_party/asmjit/CMakeLists.txt \
            || { echo "::error::third_party/asmjit did not populate — pin unreachable?"; exit 1; }
          echo "asmjit at $(git -C third_party/asmjit rev-parse HEAD)"

      - name: Submodule pins match .gitmodules branches and are reachable
        run: |
          fail=0
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read -r _ path; do
            pin=$(git rev-parse "HEAD:$path")
            if ! git -C "$path" cat-file -e "$pin^{commit}" 2>/dev/null; then
              echo "::error::$path pin $pin is not present after checkout"
              fail=1
            else
              echo "$path pinned at $pin (present)"
            fi
          done
          exit $fail

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libffi-dev libsdl2-dev libssl-dev

      # LTO off: CI wants a fast signal, not an optimised binary.
      - name: Build
        run: PHARO_DISABLE_LTO=1 ./scripts/build-linux.sh

      - name: Built artifact exists
        run: |
          find build -maxdepth 2 -name 'test_load_image' -o -maxdepth 2 -name '*.a' \
            | head -5 | grep -q . || { echo "::error::build produced nothing"; exit 1; }

  warpblt-regression:
    name: WarpBlt expression-stack regression
    runs-on: ubuntu-latest
    # DISABLED 2026-08-17. Not because it was wrong -- because it was RIGHT and
    # nobody read it.
    #
    # This job asserts the bug is still present so that fixing it fails CI
    # loudly (see the note below). The bug WAS fixed, on 2026-08-12 in
    # bf3f6c58, and docs/vm-compat-bugs.md #1 was updated to say so -- but
    # EXPECT_ERRORS here was never flipped, which is the one thing that note
    # asks for. So every run since has failed with
    #
    #     ::error::0 errors - docs/vm-compat-bugs.md #1 appears FIXED.
    #
    # i.e. it has been reporting a success as a failure for five days, and the
    # mail it generated is what got the whole workflow looked at.
    #
    # TO RE-ENABLE, which is one line and strictly better than leaving this off:
    # delete this `if: false` and set EXPECT_ERRORS/EXPECT_MAX to 0. The probe
    # itself still works and still guards a bug that took six sessions to
    # root-cause. The "macOS-arm64 sees 12" note further down is also stale --
    # bf3f6c58 measured 1440 calls / 0 errors on macOS with the JIT on and off.
    if: false
    # docs/vm-compat-bugs.md #1.  A frame's operand stack is displaced while its
    # temps stay intact, so an expression evaluates against the wrong value.
    # Stock Cog runs this probe 1440 calls / 0 errors; ours reports ~12 errors.
    # PHARO_DET_SCHED=1 drives preemption from the bytecode checkpoint instead
    # of the wall clock, which is what makes it deterministic rather than a
    # load-dependent Heisenbug -- without it the probe passes on an idle runner
    # and this job would be worthless.
    #
    # The job asserts the CURRENT state (still broken) so that FIXING it fails
    # CI loudly and forces this file and docs/vm-compat-bugs.md to be updated
    # together.  Flip EXPECT_ERRORS to 0 in the same commit as the fix.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libffi-dev libsdl2-dev libssl-dev

      - name: Build
        run: PHARO_DISABLE_LTO=1 ./scripts/build-linux.sh

      - name: Fetch a Pharo 13 image
        run: |
          mkdir -p /tmp/harness && cd /tmp/harness
          curl -sL https://get.pharo.org/64/130 | bash
          test -f /tmp/harness/Pharo.image

      - name: Run the probe under deterministic scheduling
        id: probe
        run: |
          VM=$(find build -maxdepth 2 -name test_load_image -type f | head -1)
          test -n "$VM" || { echo "::error::no VM binary"; exit 1; }
          cd /tmp/harness && rm -f startup.st
          PHARO_DET_SCHED=1 PHARO_MAX_STEPS=2000000000000 timeout 900 \
            "$GITHUB_WORKSPACE/$VM" /tmp/harness/Pharo.image eval \
            "$(cat "$GITHUB_WORKSPACE/scripts/repro/warpblt_temp_displacement.st")" \
            > /tmp/warp.log 2>&1 || true
          grep -aoE 'WARP2 calls=[0-9]+ errors=[0-9]+' /tmp/warp.log | tail -1 \
            > /tmp/warp.line || true
          cat /tmp/warp.line
          test -s /tmp/warp.line || { echo "::error::probe produced no WARP2 line"; tail -30 /tmp/warp.log; exit 1; }
          echo "errors=$(sed -E 's/.*errors=([0-9]+).*/\1/' /tmp/warp.line)" >> "$GITHUB_OUTPUT"

      - name: Compare against the recorded state
        env:
          # Upper bound, not an equality.  12 is the count measured on
          # macOS-arm64; the exact number under DET_SCHED has NOT been measured
          # on x86_64 Linux, and asserting equality against an unmeasured
          # platform would just produce false CI failures.  Tighten this to the
          # observed value once a few runs have gone green.
          EXPECT_MAX: "20"
        run: |
          GOT=${{ steps.probe.outputs.errors }}
          echo "errors=$GOT (recorded upper bound $EXPECT_MAX; macOS-arm64 sees 12)"
          if [ "$GOT" -eq 0 ]; then
            echo "::error::0 errors - docs/vm-compat-bugs.md #1 appears FIXED."
            echo "::error::That is good news, but this job asserts the bug is"
            echo "::error::still present.  Update docs/vm-compat-bugs.md and turn"
            echo "::error::this into a pass-asserting test in the same commit."
            exit 1
          fi
          if [ "$GOT" -gt "$EXPECT_MAX" ]; then
            echo "::error::$GOT errors exceeds the recorded ceiling $EXPECT_MAX - regression."
            exit 1
          fi
          echo "bug still present as expected; no regression."

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      # Full history: the autosave check below has to see every commit a push
      # introduces, not just the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # An autosave is a crash dump the build box takes with `git add -A`.  Its
      # tree and its parent are independent inputs, so a box with a current
      # parent and a stale tree records the difference as DELETIONS and pushes
      # as a clean fast-forward that nothing can refuse.  Twice now:
      #   27d378d2  2026-06-03  reverted the asmjit Catalyst pin; fresh clones
      #                         broken for 68 days because NOTHING LOOKED
      #   ede0fd65  2026-09-03  a 242-commit-stale tree, deleting a script
      # Those two are already in public history and are allowlisted here.
      #
      # Autosaves no longer reach git at all -- they are git bundles in S3, see
      # scripts/aws/README.md -- so this is a regression guard.  It fires if
      # that behaviour comes back, or if an old dump is merged in.  The
      # signature is read from config.env, so it cannot drift from what
      # preserve.sh actually writes.
      - name: No autosave commit on a build branch
        run: |
          . scripts/aws/config.env
          known='^(27d378d2|ede0fd65)'
          found=$( { git log HEAD --format='%H %an: %s' -F --author="$AUTOSAVE_AUTHOR_NAME"
                     git log HEAD --format='%H %an: %s' -F --grep="$AUTOSAVE_SUBJECT_PREFIX"
                   } | sort -u | grep -vE "$known" || true )
          if [ -n "$found" ]; then
            echo "::error::an autosave commit is on this branch — a crash dump is not a commit anyone chose to make:"
            printf '%s\n' "$found"
            echo "Recover what you need from it, then drop it from the branch."
            echo "See scripts/aws/README.md, 'Why the autosave is not in git'."
            exit 1
          fi
          echo "no new autosave commits on this branch"

      # build-hunt/ (21 MB of object files) was committed because .gitignore
      # listed build directories by exact name and that one was not on the
      # list.  Catch the next one mechanically.
      - name: No build output tracked
        run: |
          bad=$(git ls-files | grep -nE '(^|/)(build[^/]*|[^/]*-build)/' || true)
          if [ -n "$bad" ]; then
            echo "::error::build directories are tracked:"; echo "$bad" | head -20; exit 1
          fi
          # .o/.obj are never legitimate here.
          objs=$(git ls-files | grep -E '\.(o|obj)$' || true)
          if [ -n "$objs" ]; then
            echo "::error::object files are tracked:"; echo "$objs" | head -20; exit 1
          fi
          # Libraries ARE legitimate in two vendored locations and nowhere else:
          #   third_party/windows-runtime-dlls/  redistributable Windows runtime
          #   iospharo/Frameworks/               SDL2 dylibs shipped in the app
          libs=$(git ls-files | grep -E '\.(a|dylib|so|dll)$' \
                 | grep -vE '^(third_party/windows-runtime-dlls|iospharo/Frameworks)/' || true)
          if [ -n "$libs" ]; then
            echo "::error::compiled libraries tracked outside the vendored dirs:"
            echo "$libs" | head -20; exit 1
          fi
          echo "no build output tracked"

      - name: Shell scripts parse
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done
          exit $fail

      - name: Shellcheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S error $(git ls-files '*.sh') || true

      # Every third-party tarball must stay pinned by hash, not just version.
      - name: Tarball checksums are present
        run: |
          fail=0
          for v in LIBPNG FREETYPE PIXMAN HARFBUZZ CAIRO OPENSSL LIBSSH2 LIBGIT2; do
            grep -q "^${v}_SHA256=\"[a-f0-9]\{64\}\"" scripts/build-third-party.sh \
              || { echo "::error::${v}_SHA256 missing or malformed"; fail=1; }
          done
          grep -q '^LIBFFI_SHA256="[a-f0-9]\{64\}"' scripts/build-libffi.sh \
            || { echo "::error::LIBFFI_SHA256 missing"; fail=1; }
          grep -q '^SDL2_SHA256="[a-f0-9]\{64\}"' scripts/build-sdl2.sh \
            || { echo "::error::SDL2_SHA256 missing"; fail=1; }
          exit $fail

      # The SPM dependency is declared as a floating range
      # (upToNextMajorVersion), so Package.resolved is the only thing pinning
      # the actual version.  It was untracked for the life of the project
      # because a bare `*.xcworkspace` ignore swallowed it.
      - name: SPM lockfile is committed
        run: |
          f=iospharo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          git ls-files --error-unmatch "$f" >/dev/null 2>&1 \
            || { echo "::error::$f is not tracked — SPM dependencies are unpinned"; exit 1; }
          echo "SPM lockfile tracked"

      # Every script that packages an xcframework must check what it produced.
      - name: Artifact-producing scripts validate their output
        run: |
          fail=0
          for f in scripts/build-libffi.sh scripts/build-sdl2.sh \
                   scripts/build-third-party.sh scripts/build-xcframework.sh; do
            grep -q 'validate_xcframework' "$f" \
              || { echo "::error file=$f::packages an xcframework without validating it"; fail=1; }
          done
          exit $fail
